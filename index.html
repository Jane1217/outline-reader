<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="阅读器">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfbfc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>目录阅读器</title>
<style>
/* 布局：左窄工具条 | 正文（独立滚动） | 拖动条 | 右侧目录（整屏高度，按章节折叠） */
:root {
  --bg: #fbfbfc;
  --side-bg: #f0f2f6;
  --fg: #1b1f27;
  --muted: #647084;
  --line: #dde1e8;
  --accent: #3555d6;
  --accent-soft: #e3e9fb;
  --code-bg: #eef0f5;
  --quote: #c6cdda;
  --shadow: 0 8px 28px rgba(20, 30, 60, .18);
  --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-w: 260px;
  --toc-fs: 12px;
  --body-fs: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --side-bg: #1a1d24; --fg: #e3e6ec; --muted: #97a1b3; --line: #2a2f39;
    --accent: #8fa5ff; --accent-soft: #252c47; --code-bg: #1f232c; --quote: #3a4151;
    --shadow: 0 8px 28px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --side-bg: #1a1d24; --fg: #e3e6ec; --muted: #97a1b3; --line: #2a2f39;
  --accent: #8fa5ff; --accent-soft: #252c47; --code-bg: #1f232c; --quote: #3a4151;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--ui-font); -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: flex; height: 100%; width: 100%; }

/* ---------- 左侧窄工具条 ---------- */
.rail {
  flex: none; width: 46px; box-sizing: border-box;
  padding: 6px 3px calc(6px + env(safe-area-inset-bottom, 0px)) calc(3px + env(safe-area-inset-left, 0px));
  width: calc(46px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--side-bg); border-right: 1px solid var(--line);
}
.rail .sp { flex: 1; }
.rb {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}
.rb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rb .aa { font-size: 14px; font-weight: 700; letter-spacing: -.5px; }
.rb:active, .rb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
@media (hover: hover) { .rb:hover { background: var(--accent-soft); color: var(--accent); } }
.rb .ic-light, .rb .ic-dark { display: none; }
:root[data-theme="light"] .rb .ic-light, :root[data-theme="dark"] .rb .ic-dark { display: block; }
:root[data-theme="light"] .rb .ic-auto, :root[data-theme="dark"] .rb .ic-auto { display: none; }
.dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #2f9e57; margin: -14px -14px 0 0; }
.rb { position: relative; }
.rb .dot { top: 7px; right: 7px; margin: 0; }
.rb .dot.off { background: #c4562f; }

/* ---------- 正文 ---------- */
.main { flex: 1; min-width: 0; height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }
.doc {
  max-width: 860px; margin: 0 auto; box-sizing: border-box;
  padding: 26px max(22px, 3vw) 70vh;
  font-size: var(--body-fs); line-height: 1.75; overflow-wrap: break-word;
}
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { line-height: 1.3; margin: 1.7em 0 .6em; scroll-margin-top: 12px; text-wrap: balance; }
.doc h1 { font-size: 1.75em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
.doc h2 { font-size: 1.4em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 1.18em; }
.doc h4 { font-size: 1.05em; }
.doc h5, .doc h6 { font-size: 1em; color: var(--muted); }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc .tw { margin: 0 0 1em; }
.doc ul, .doc ol { padding-left: 1.6em; }
.doc li + li { margin-top: .25em; }
.doc a { color: var(--accent); }
.doc blockquote { margin-left: 0; padding: .1em 1em; border-left: 3px solid var(--quote); color: var(--muted); }
.doc code { font-family: var(--mono-font); font-size: .88em; background: var(--code-bg); padding: .12em .38em; border-radius: 4px; }
.doc pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.55; }
.doc pre code { background: none; padding: 0; font-size: .86em; }
.doc .tw { overflow-x: auto; }
.doc table { border-collapse: collapse; font-size: .94em; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; vertical-align: top; }
.doc th { background: var(--side-bg); }
.doc img { max-width: 100%; height: auto; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

/* ---------- 拖动条 ---------- */
.grip {
  flex: none; position: relative; width: 9px; cursor: col-resize; touch-action: none;
  background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat;
}
.grip::before { content: ""; position: absolute; inset: 0 -11px; }
.grip::after { content: ""; position: absolute; top: 50%; left: 50%; width: 3px; height: 36px; margin: -18px 0 0 -1.5px; border-radius: 2px; background: var(--quote); }
.grip.drag::after, .grip:focus-visible::after { background: var(--accent); }
@media (hover: hover) { .grip:hover::after { background: var(--accent); } }
.grip.drag { background: linear-gradient(var(--accent), var(--accent)) center / 2px 100% no-repeat; }
body.dragging { user-select: none; -webkit-user-select: none; cursor: col-resize; }
.app.notoc .grip, .app.notoc .side { display: none; }

/* ---------- 右侧目录：整屏高度 ---------- */
.side {
  width: var(--side-w); flex: none; min-width: 0; height: 100%;
  display: flex; flex-direction: column; background: var(--side-bg);
}
.search { padding: 6px 6px 4px; }
.search input {
  width: 100%; box-sizing: border-box; min-height: 28px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 12px;
}
.toc {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 3px 3px calc(20px + env(safe-area-inset-bottom, 0px)) 3px;
}
.r { display: flex; align-items: stretch; border-radius: 5px; position: relative; }
.r .chev {
  flex: none; width: 26px; border: 0; background: transparent; padding: 0; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; margin-left: calc(var(--d, 0) * 11px);
}
.r .chev svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
.r .chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.r .chev.none { cursor: default; pointer-events: none; }
.r .chev.none svg { display: none; }
.r .lab {
  flex: 1; min-width: 0; font-size: var(--toc-fs); line-height: 1.35; padding: .36em 6px .36em 0;
  color: var(--muted); cursor: pointer; overflow-wrap: anywhere; user-select: none; -webkit-user-select: none;
}
.r.d0 .lab { color: var(--fg); font-weight: 650; }
.r.d0 { margin-top: 3px; }
/* 当前阅读位置：只跟随正文滚动，点过之后不会留下颜色 */
.r.on { background: var(--accent-soft); }
.r.on .lab { color: var(--accent); font-weight: 650; }
.r.in::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); opacity: .55; }
.r .lab:active { opacity: .6; }
@media (hover: hover) { .r:not(.on):hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); } }
.toc .none { padding: 14px 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }

/* ---------- 弹出面板 ---------- */
.pop {
  position: fixed; left: calc(52px + env(safe-area-inset-left, 0px)); z-index: 15; box-sizing: border-box;
  width: min(380px, 70vw); max-height: 84vh; overflow-y: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  font-size: 13px;
}
.pop h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
.btns { display: inline-flex; gap: 5px; align-items: center; }
.btn {
  min-height: 34px; min-width: 38px; padding: 0 12px; border: 1px solid var(--line); background: var(--side-bg);
  border-radius: 8px; font-size: 13px; cursor: pointer;
}
.btn:active { background: var(--accent-soft); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.wide { width: 100%; text-align: left; }
.val { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.dl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; max-height: 46vh; overflow-y: auto; }
.dl .btn { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
.dl .dgrp { font-size: 11px; color: var(--muted); margin: 8px 2px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find { width: 100%; box-sizing: border-box; min-height: 32px; padding: 0 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--side-bg); color: var(--fg); font: inherit; font-size: 13px; }
#ghConnect { margin-top: 8px; }
.ghform { margin-top: 8px; }
.wr { display: flex; gap: 4px; flex: none; }
.wr .btn:first-child { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wr .btn:last-child { min-width: 38px; padding: 0; }
.row2 { display: flex; gap: 6px; }
.row2 .btn { flex: 1; }
.srcs { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.src { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src button { border: 0; background: transparent; color: var(--muted); font-size: 16px; min-width: 34px; min-height: 30px; }
.hint { margin: 8px 0 0; font-size: 12px; line-height: 1.55; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); font-size: 13px; padding: 9px 14px; border-radius: 8px; max-width: 80vw; z-index: 20;
}
.dropmask {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); font-size: 18px; font-weight: 600; color: var(--accent);
  border: 3px dashed var(--accent);
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="工具">
    <button class="rb" id="bDocs" type="button" aria-label="文档与同步" title="文档与同步">
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg><i class="dot" id="syncDot" hidden></i>
    </button>
    <button class="rb" id="bFold" type="button" aria-label="目录折叠层级" title="目录折叠层级">
      <svg viewBox="0 0 24 24"><path d="M7 9l5-5 5 5"/><path d="M7 15l5 5 5-5"/></svg>
    </button>
    <button class="rb" id="bSearch" type="button" aria-label="筛选目录" aria-pressed="false" title="筛选目录">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="rb" id="bToc" type="button" aria-label="显示或隐藏目录" aria-pressed="true" title="显示或隐藏目录">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M15 5v14"/></svg>
    </button>
    <span class="sp"></span>
    <button class="rb" id="bFull" type="button" aria-label="全屏" title="全屏" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="rb" id="bAa" type="button" aria-label="字号与主题" title="字号与主题"><span class="aa">Aa</span></button>
    <button class="rb" id="bTheme" type="button" aria-label="切换深色或浅色" title="切换深色或浅色">
      <svg class="ic-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="ic-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      <svg class="ic-dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </nav>

  <main class="main" id="main"><article class="doc" id="doc"></article></main>

  <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="拖动调整目录宽度" tabindex="0"></div>
  <aside class="side" id="side" aria-label="目录">
    <div class="search" id="searchRow" hidden><input id="filter" type="search" placeholder="筛选目录" autocomplete="off" aria-label="筛选目录"></div>
    <nav class="toc" id="toc"></nav>
  </aside>
</div>

<div class="pop" id="pop" hidden>
  <section data-panel="docs">
    <h3>文档</h3>
    <input class="find" id="docFilter" type="search" placeholder="搜索文件" autocomplete="off" aria-label="搜索文件" hidden>
    <div class="dl" id="docList"></div>
    <div class="row2"><button class="btn" id="addFolder" type="button" hidden>添加文件夹…</button><button class="btn" id="openLocal" type="button">打开文件…</button></div>
    <div class="srcs" id="srcList"></div>
    <button class="btn wide" id="ghConnect" type="button" hidden>连接 GitHub 文库…</button>
    <div class="ghform" id="ghForm" hidden>
      <input class="find" id="ghRepo" placeholder="仓库，例如 用户名/reader-docs" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="GitHub 仓库">
      <input class="find" id="ghDir" placeholder="文件夹，默认 docs" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="仓库里的文件夹">
      <input class="find" id="ghToken" type="password" placeholder="只读令牌 github_pat_…" autocomplete="off" aria-label="GitHub 只读令牌">
      <div class="row2"><button class="btn" id="ghSave" type="button">保存并连接</button><button class="btn" id="ghCancel" type="button">取消</button></div>
    </div>
    <p class="hint" id="syncStatus"></p>
    <p class="hint" id="installHint" hidden>想要全屏：在 Safari 点分享按钮，选“添加到主屏幕”，之后从主屏幕图标打开。</p>
  </section>
  <section data-panel="fold" hidden>
    <h3>目录显示到第几级</h3>
    <div class="dl">
      <button class="btn wide" type="button" data-level="1">只看大章节</button>
      <button class="btn wide" type="button" data-level="2">展开到二级标题</button>
      <button class="btn wide" type="button" data-level="99">全部展开</button>
    </div>
    <p class="hint">点目录里每行左边的小箭头，可以单独折叠或展开那一章。正文滚到哪，目录会自动展开到哪。</p>
  </section>
  <section data-panel="aa" hidden>
    <h3>显示</h3>
    <div class="row"><span>目录字号</span><span class="btns"><button class="btn" id="tocMinus" type="button" aria-label="目录字号减小">A−</button><span class="val" id="tocVal"></span><button class="btn" id="tocPlus" type="button" aria-label="目录字号增大">A+</button></span></div>
    <div class="row"><span>正文字号</span><span class="btns"><button class="btn" id="bodyMinus" type="button" aria-label="正文字号减小">A−</button><span class="val" id="bodyVal"></span><button class="btn" id="bodyPlus" type="button" aria-label="正文字号增大">A+</button></span></div>
    <div class="row"><span>主题</span><span class="btns" id="themeBtns">
      <button class="btn" type="button" data-theme-set="auto">自动</button><button class="btn" type="button" data-theme-set="light">浅色</button><button class="btn" type="button" data-theme-set="dark">深色</button>
    </span></div>
    <p class="hint">目录宽度：直接拖动正文和目录之间的竖条。</p>
  </section>
</div>

<input type="file" id="file" multiple hidden>
<div class="toast" id="toast" hidden role="status"></div>
<div class="dropmask" id="dropmask" hidden>松手即可打开文档</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'none' },
    startup: { typeset: false }
  };
</script>
<script async id="mj" src="vendor/tex-svg.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var app = $('app'), grip = $('grip'), main = $('main'), doc = $('doc'), toc = $('toc'), pop = $('pop');

  /* ---------- 原生 App 外壳（WKWebView）提供的文件库；在 Safari 里则没有 ---------- */
  var NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);
  var lib = { sources: [], files: [] };
  function nsend(o) { window.webkit.messageHandlers.native.postMessage(o); }
  function b64ToBuf(b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

  /* ---------- 设置（保存在这台设备上） ---------- */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  var S = { w: 260, tocFs: 12, bodyFs: 16, theme: 'auto', hideToc: false };
  try { var sv = JSON.parse(lsGet('dr2:settings') || '{}'); for (var k in sv) if (k in S) S[k] = sv[k]; } catch (e) {}
  function saveSettings() { lsSet('dr2:settings', JSON.stringify(S)); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function maxW() { return Math.max(180, Math.min(window.innerWidth * 0.7, 780)); }

  function applySettings() {
    S.w = clamp(S.w, 120, maxW());
    root.style.setProperty('--side-w', S.w + 'px');
    root.style.setProperty('--toc-fs', S.tocFs + 'px');
    root.style.setProperty('--body-fs', S.bodyFs + 'px');
    if (S.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', S.theme);
    app.classList.toggle('notoc', !!S.hideToc);
    $('bToc').setAttribute('aria-pressed', String(!S.hideToc));
    $('tocVal').textContent = S.tocFs; $('bodyVal').textContent = S.bodyFs;
    document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === S.theme)); });
    var dark = effectiveDark();
    document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14161b' : '#fbfbfc');
  }
  function effectiveDark() {
    if (S.theme === 'dark') return true;
    if (S.theme === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);

  /* ---------- 拖动目录宽度（目录在右侧，往左拖变宽） ---------- */

  var noServer = false, webDocs = [], idbP = null;
  function idb() {
    if (!idbP) idbP = new Promise(function (res) {
      try {
        var r = indexedDB.open('dr-lib', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('docs', { keyPath: 'name' }); };
        r.onsuccess = function () { res(r.result); }; r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return idbP;
  }
  function idbDo(mode, fn) {
    return idb().then(function (db) {
      if (!db) return null;
      return new Promise(function (res) {
        try {
          var tx = db.transaction('docs', mode), req = fn(tx.objectStore('docs'));
          tx.oncomplete = function () { res(req && req.result !== undefined ? req.result : true); };
          tx.onerror = tx.onabort = function () { res(null); };
        } catch (e) { res(null); }
      });
    });
  }
  function loadWebDocs() {
    return idbDo('readonly', function (s) { return s.getAll(); }).then(function (a) {
      webDocs = (Array.isArray(a) ? a : []).sort(function (x, y) { return y.ts - x.ts; });
    });
  }
  function openWebDoc(d, keepPos) {
    var html = d.kind === 'html' ? d.content : mdToHtml(d.content);
    var pos = keepPos ? 0 : (parseInt(lsGet('dr2:pos:web:' + d.name) || '0', 10) || 0);
    showDoc(d.name, html, { source: 'web', key: 'web:' + d.name, keepPos: !!keepPos, top: pos });
    lsSet('dr2:webcur', d.name);
  }
  function groupHead(box, text) { var g = document.createElement('div'); g.className = 'dgrp'; g.textContent = text; box.appendChild(g); }
  function renderWebList(box) {
    $('syncDot').hidden = !GH; $('syncDot').classList.toggle('off', !!ghError);
    if (GH) {
      groupHead(box, 'GitHub · ' + GH.repo + (GH.dir ? ' / ' + GH.dir : ''));
      ghFiles.forEach(function (f) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
        b.textContent = f.name; b.title = f.name; b.setAttribute('aria-pressed', String(curKey === 'gh:' + f.path));
        b.onclick = function () { closePanel(); ghOpen(f, false); };
        box.appendChild(b);
      });
      if (!ghFiles.length && !ghError) { var e0 = document.createElement('div'); e0.className = 'hint'; e0.textContent = '这个文件夹里还没有文档'; box.appendChild(e0); }
      if (webDocs.length) groupHead(box, '本机上传');
    }
    webDocs.forEach(function (d) {
      var row = document.createElement('div'); row.className = 'wr';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
      b.textContent = d.name; b.title = d.name; b.setAttribute('aria-pressed', String(curKey === 'web:' + d.name));
      b.onclick = function () { closePanel(); openWebDoc(d, false); renderDocList(); };
      var x = document.createElement('button'); x.type = 'button'; x.className = 'btn'; x.textContent = '×'; x.setAttribute('aria-label', '删除 ' + d.name);
      x.onclick = function () { idbDo('readwrite', function (s) { return s.delete(d.name); }).then(loadWebDocs).then(renderDocList); };
      row.appendChild(b); row.appendChild(x); box.appendChild(row);
    });
    if (!webDocs.length && !GH) {
      var h = document.createElement('div'); h.className = 'hint'; h.textContent = '还没有文档。点下面的“上传”选文件，或者连接 GitHub 文库。'; box.appendChild(h);
    }
    $('ghConnect').textContent = GH ? '断开 GitHub' : '连接 GitHub 文库…';
    $('syncStatus').textContent = GH
      ? (ghError ? ghError : '已连接 ' + GH.repo + '，每 4 秒检查一次，Mac 上的文件保存后几秒内这里就会更新。最近检查：' + (ghLast ? fmtTime(ghLast) : '—'))
      : '上传的文档只保存在这台设备的浏览器里，不会发送到任何服务器。再次上传同名文件，就是更新这份文档。';
  }

  /* ----- GitHub 文库：Mac 上的文件自动同步到私有仓库，这里定时检查并更新 ----- */
  var GH = null; try { GH = JSON.parse(lsGet('dr2:gh') || 'null'); } catch (e) {}
  var ghFiles = [], ghDirEtag = null, ghEtags = {}, ghLast = null, ghError = '', ghTick = 0;
  function ghUrl(path) {
    var base = (GH.api || 'https://api.github.com') + '/repos/' + GH.repo + '/contents';
    if (path) base += '/' + path.split('/').map(encodeURIComponent).join('/');
    return base + (GH.branch ? '?ref=' + encodeURIComponent(GH.branch) : '');
  }
  function ghHeaders(raw, etag) {
    var h = { 'Authorization': 'Bearer ' + GH.token, 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    if (etag) h['If-None-Match'] = etag;
    return h;
  }
  function ghErr(c) {
    if (c === 401) return '令牌无效或已过期，请断开后重新连接';
    if (c === 403 || c === 404) return '找不到这个仓库或文件夹，或者令牌没有读取权限';
    return '连不上 GitHub，稍后会自动重试';
  }
  function ghList() {
    if (!GH) return Promise.resolve();
    return fetch(ghUrl(GH.dir || ''), { headers: ghHeaders(false, ghDirEtag), cache: 'no-store' }).then(function (r) {
      ghLast = new Date();
      if (r.status === 304) return null;
      if (!r.ok) throw r.status;
      ghDirEtag = r.headers.get('ETag'); return r.json();
    }).then(function (list) {
      ghError = '';
      if (list) ghFiles = (Array.isArray(list) ? list : []).filter(function (f) { return f.type === 'file' && /\.(md|markdown|txt|docx)$/i.test(f.name); })
        .map(function (f) { return { name: f.name, path: f.path }; });
    }).catch(function (c) { ghError = ghErr(c); }).then(function () { if (noServer) renderDocList(); });
  }
  function ghOpen(f, isUpdate) {
    var ext = (f.name.split('.').pop() || '').toLowerCase();
    return fetch(ghUrl(f.path), { headers: ghHeaders(true, isUpdate ? ghEtags[f.path] : null), cache: 'no-store' }).then(function (r) {
      ghLast = new Date();
      if (r.status === 304) return null;
      if (!r.ok) throw r.status;
      ghEtags[f.path] = r.headers.get('ETag');
      return ext === 'docx' ? r.arrayBuffer() : r.text();
    }).then(function (body) {
      if (body === null) return;
      if (isUpdate && curKey !== 'gh:' + f.path) return;
      return (ext === 'docx' ? wordToHtml(body) : Promise.resolve(mdToHtml(body))).then(function (html) {
        var pos = isUpdate ? 0 : (parseInt(lsGet('dr2:pos:gh:' + f.path) || '0', 10) || 0);
        showDoc(f.name, html, { source: 'gh', key: 'gh:' + f.path, keepPos: isUpdate, top: pos });
        lsSet('dr2:ghcur', f.path);
        ghError = '';
        if (isUpdate) toast('文档已更新 ' + fmtTime(new Date()));
        renderDocList();
      });
    }).catch(function (c) { ghError = ghErr(c); if (!isUpdate) toast(ghError); renderDocList(); });
  }
  function ghOpenSaved() {
    return ghList().then(function () {
      var want = lsGet('dr2:ghcur');
      var f = ghFiles.filter(function (x) { return x.path === want; })[0] || ghFiles[0];
      return f ? (ghOpen(f, false), true) : false;
    });
  }
  function ghRefreshNow() {
    if (!GH || !noServer) return;
    var cur = ghFiles.filter(function (f) { return curKey === 'gh:' + f.path; })[0];
    if (cur) ghOpen(cur, true);
    ghList();
  }
  setInterval(function () {
    if (!GH || !noServer || document.hidden) return;
    ghTick++;
    var cur = ghFiles.filter(function (f) { return curKey === 'gh:' + f.path; })[0];
    if (cur) ghOpen(cur, true);
    if (ghTick % 6 === 0) ghList();
  }, 4000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) ghRefreshNow(); });
  $('ghConnect').onclick = function () {
    if (GH) {
      GH = null; ghFiles = []; ghDirEtag = null; ghEtags = {}; ghError = ''; lsSet('dr2:gh', '');
      $('ghForm').hidden = true; renderDocList(); return;
    }
    $('ghForm').hidden = false; $('ghRepo').focus();
  };
  $('ghCancel').onclick = function () { $('ghForm').hidden = true; };
  $('ghSave').onclick = function () {
    var repo = $('ghRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
    var token = $('ghToken').value.trim(), dir = ($('ghDir').value.trim() || 'docs').replace(/^\/+|\/+$/g, '');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast('仓库要写成 用户名/仓库名'); return; }
    if (!token) { toast('请填入只读令牌'); return; }
    GH = { repo: repo, dir: dir, token: token }; ghDirEtag = null; ghEtags = {}; ghFiles = []; ghError = '';
    lsSet('dr2:gh', JSON.stringify(GH));
    $('ghToken').value = ''; $('ghForm').hidden = true;
    ghOpenSaved().then(function (ok) { if (ok) closePanel(); renderDocList(); });
  };
  function readUpload(file) {
    var name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
    if (ext === 'doc') { toast('不支持旧版 .doc，请先在 Word 里另存为 .docx'); return Promise.resolve(null); }
    var p = ext === 'docx'
      ? file.arrayBuffer().then(wordToHtml).then(function (h) { return { kind: 'html', content: h }; })
      : file.text().then(function (t) { return { kind: 'md', content: t }; });
    return p.then(function (r) {
      var rec = { name: name, kind: r.kind, content: r.content, ts: Date.now(), size: file.size };
      return idbDo('readwrite', function (s) { return s.put(rec); }).then(function (ok) {
        if (ok === null) toast('浏览器不允许保存文档，这次只能临时查看');
        return rec;
      });
    }).catch(function () { toast('“' + name + '”读取失败'); return null; });
  }
  function openFiles(files) {
    files = Array.prototype.slice.call(files || []);
    if (!files.length) return;
    closePanel();
    var last = null;
    files.reduce(function (p, f) { return p.then(function () { return readUpload(f).then(function (rec) { if (rec) last = rec; }); }); }, Promise.resolve())
      .then(loadWebDocs).then(function () {
        if (last) {
          var same = curKey === 'web:' + last.name;
          openWebDoc(last, same);
          if (same) toast('文档已更新');
          else if (files.length > 1) toast('已上传 ' + files.length + ' 个文档');
        }
        renderDocList();
      });
  }
  var WELCOME = [
    '# 目录阅读器', '',
    '点左边第一个按钮，再点“上传”，选择 Markdown 或 Word 文件。', '',
    '## 怎么用', '',
    '### 上传文档', '支持 .md、.markdown、.txt、.docx，可以一次选多个。上传的文档只保存在这台设备的浏览器里，可以随时切换或删除。', '',
    '### 更新文档', '文档在电脑上改过之后，重新上传同名文件，就会替换旧版本，并停在你读到的位置。', '',
    '## 目录栏', '',
    '### 折叠和跟随', '目录在右侧，占满屏幕高度。点每行左边的小箭头折叠章节；正文滚到哪，目录就高亮哪一行。', '',
    '### 调整宽度', '拖动正文和目录之间的竖条。目录变宽变窄，正文会让位而不是被盖住。', '',
    '### 深色和浅色', '左下角的按钮可以来回切换。', ''
  ].join('\n');
  function showWelcome() { showDoc('欢迎使用.md', mdToHtml(WELCOME), { source: 'local', key: 'welcome' }); }
  $('file').addEventListener('change', function (e) { openFiles(e.target.files); });
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; $('dropmask').hidden = false; });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropmask').hidden = true; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; $('dropmask').hidden = true;
    if (e.dataTransfer && e.dataTransfer.files.length) openFiles(e.dataTransfer.files);
  });

  /* ---------- 启动 ---------- */
  applySettings();
  renderToc();
  if (NATIVE) { nsend({ type: 'ready' }); return; }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
  fetch('api/docs', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (list) {
    serverOn = true; lastSync = new Date(); serverDocs = list;
    if (!list.length) throw 0;
    var want = lsGet('dr2:cur');
    var d = list.find(function (x) { return x.name === want; }) || list[0];
    return loadServerDoc(d, false).then(renderDocList);
  }).catch(function () {
    serverOn = false; noServer = true;
    $('openLocal').textContent = '上传 Markdown / Word…';
    $('ghConnect').hidden = false;
    loadWebDocs().then(function () {
      var showLocal = function () {
        var want = lsGet('dr2:webcur');
        var d = webDocs.filter(function (x) { return x.name === want; })[0] || webDocs[0];
        if (d) openWebDoc(d, false); else showWelcome();
        renderDocList();
      };
      if (GH) ghOpenSaved().then(function (ok) { if (!ok) showLocal(); renderDocList(); });
      else showLocal();
    });
  });
})();
</script>
</body>
</html>
