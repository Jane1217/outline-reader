<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="阅读器">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfbfc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>目录阅读器</title>
<style>
/* 布局：左窄工具条 | 正文（独立滚动） | 拖动条 | 右侧目录（整屏高度，按章节折叠） */
:root {
  --bg: #eceef2;
  --side-bg: #e1e5eb;
  --fg: #232935;
  --strong: #04060b;
  --strong-w: 700;
  --muted: #4b5668;
  --toc-sub: #38425a;
  --line: #c6ccd7;
  --accent: #2f4fcf;
  --accent-soft: #d3dcf5;
  --code-bg: #dfe3ea;
  --quote: #aab3c3;
  --shadow: 0 8px 28px rgba(20, 30, 60, .18);
  --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --side-w: 260px;
  --toc-fs: 12px;
  --body-fs: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --strong: #ffffff; --strong-w: 800; --toc-sub: #b9c1d0;
    --bg: #14161b; --side-bg: #1a1d24; --fg: #cdd3dd; --muted: #9aa4b6; --line: #2a2f39;
    --accent: #8fa5ff; --accent-soft: #252c47; --code-bg: #1f232c; --quote: #3a4151;
    --shadow: 0 8px 28px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --strong: #ffffff; --strong-w: 800; --toc-sub: #b9c1d0;
  --bg: #14161b; --side-bg: #1a1d24; --fg: #cdd3dd; --muted: #9aa4b6; --line: #2a2f39;
  --accent: #8fa5ff; --accent-soft: #252c47; --code-bg: #1f232c; --quote: #3a4151;
  --shadow: 0 8px 28px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--ui-font); -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: flex; height: 100%; width: 100%; overflow: hidden; }

/* ---------- 左侧窄工具条 ---------- */
.rail {
  flex: none; width: 46px; box-sizing: border-box;
  padding: 6px 3px calc(6px + env(safe-area-inset-bottom, 0px)) calc(3px + env(safe-area-inset-left, 0px));
  width: calc(46px + env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--side-bg); border-right: 1px solid var(--line);
}
.rail .sp { flex: 1; }
.rb {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}
.rb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rb .aa { font-size: 14px; font-weight: 700; letter-spacing: -.5px; }
.rb:active, .rb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
@media (hover: hover) { .rb:hover { background: var(--accent-soft); color: var(--accent); } }
.rb .ic-light, .rb .ic-dark { display: none; }
:root[data-theme="light"] .rb .ic-light, :root[data-theme="dark"] .rb .ic-dark { display: block; }
:root[data-theme="light"] .rb .ic-auto, :root[data-theme="dark"] .rb .ic-auto { display: none; }
.dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #2f9e57; margin: -14px -14px 0 0; }
.rb { position: relative; }
.rb .dot { top: 7px; right: 7px; margin: 0; }
.rb .dot.off { background: #c4562f; }

/* ---------- 正文 ---------- */
.col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; position: relative; }
.col.tdrag .tpane { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: var(--tp-max); will-change: transform; }
.col.tdrag .tgrip { position: absolute; left: 0; right: 0; bottom: var(--tp-max); z-index: 4; will-change: transform; }
.main { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; overflow-anchor: none; }

/* ---------- 底部译文栏：固定显示，不盖住原文 ---------- */
.tgrip {
  flex: none; position: relative; height: 9px; cursor: row-resize; touch-action: none;
  background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat;
}
.tgrip::before { content: ""; position: absolute; inset: -11px 0; }
.tgrip::after { content: ""; position: absolute; left: 50%; top: 50%; width: 36px; height: 3px; margin: -1.5px 0 0 -18px; border-radius: 2px; background: var(--quote); }
.tgrip.drag::after, .tgrip:focus-visible::after { background: var(--accent); }
body.dragging-y { user-select: none; -webkit-user-select: none; cursor: row-resize; }
.tpane { flex: none; height: var(--tp-h, 34vh); display: flex; flex-direction: column; min-height: 0; background: var(--side-bg); contain: layout paint style; }
.thead { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.thead .ttitle { font-weight: 650; color: var(--fg); }
.thead .tsp { flex: 1; }
.thead .btn { min-height: 28px; min-width: 28px; padding: 0 9px; font-size: 12px; }
.tlist { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.thint { font-size: 13px; line-height: 1.65; color: var(--muted); padding: 6px 2px; }
.thint .btn { margin-top: 6px; }
.tcard { flex: none; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px 8px; }
.tcard .thd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.tcard .tsrc { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard .tmeta { flex: none; font-variant-numeric: tabular-nums; }
.tcard .tx { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 12px; min-width: 36px; min-height: 30px; border-radius: 6px; }
.tcard .tx:active { background: var(--accent-soft); color: var(--accent); }
.tbody { font-size: 15px; line-height: 1.65; overflow-wrap: break-word; user-select: text; -webkit-user-select: text; }
.tbody > :first-child { margin-top: 0; }
.tbody > :last-child { margin-bottom: 0; }
.tbody h1, .tbody h2, .tbody h3, .tbody h4, .tbody h5, .tbody h6 { line-height: 1.3; margin: .9em 0 .35em; }
.tbody h1 { font-size: 1.3em; } .tbody h2 { font-size: 1.18em; } .tbody h3 { font-size: 1.08em; } .tbody h4, .tbody h5, .tbody h6 { font-size: 1em; }
.tbody p, .tbody ul, .tbody ol, .tbody blockquote, .tbody pre { margin: 0 0 .7em; }
.tbody ul, .tbody ol { padding-left: 1.5em; }
.tbody li + li { margin-top: .2em; }
.tbody blockquote { margin-left: 0; padding: .05em .9em; border-left: 3px solid var(--quote); color: var(--muted); }
.tbody code { font-family: var(--mono-font); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.tbody pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.tbody pre code { background: none; padding: 0; }
.tbody table { border-collapse: collapse; font-size: .94em; }
.tbody th, .tbody td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
.tbody.typing > :last-child::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
.terr { color: #c4562f; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tbody.typing > :last-child::after { animation: none; } }
.doc {
  max-width: 860px; margin: 0 auto; box-sizing: border-box;
  padding: 26px max(22px, 3vw) 70vh;
  font-size: var(--body-fs); line-height: 1.75; overflow-wrap: break-word;
}
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { line-height: 1.3; margin: 1.7em 0 .6em; scroll-margin-top: 12px; text-wrap: balance; }
.doc h1 { font-size: 1.75em; padding-bottom: .3em; border-bottom: 1px solid var(--line); }
.doc h2 { font-size: 1.4em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 1.18em; }
.doc h4 { font-size: 1.05em; }
.doc h5, .doc h6 { font-size: 1em; color: var(--muted); }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc .tw { margin: 0 0 1em; }
.doc ul, .doc ol { padding-left: 1.6em; }
.doc li + li { margin-top: .25em; }
.doc a { color: var(--accent); }
.doc strong, .doc b, .tbody strong, .tbody b { color: var(--strong); font-weight: var(--strong-w); }
.doc blockquote { margin-left: 0; padding: .1em 1em; border-left: 3px solid var(--quote); color: var(--muted); }
.doc code { font-family: var(--mono-font); font-size: .88em; background: var(--code-bg); padding: .12em .38em; border-radius: 4px; }
.doc pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.55; }
.doc pre code { background: none; padding: 0; font-size: .86em; }
.doc .tw { overflow-x: auto; }
.doc table { border-collapse: collapse; font-size: .94em; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; vertical-align: top; }
.doc th { background: var(--side-bg); }
.doc img { max-width: 100%; height: auto; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

/* ---------- 拖动条 ---------- */
.grip {
  flex: none; position: relative; width: 9px; cursor: col-resize; touch-action: none;
  background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat;
}
.grip::before { content: ""; position: absolute; inset: 0 -11px; }
.grip::after { content: ""; position: absolute; top: 50%; left: 50%; width: 3px; height: 36px; margin: -18px 0 0 -1.5px; border-radius: 2px; background: var(--quote); }
.grip.drag::after, .grip:focus-visible::after { background: var(--accent); }
@media (hover: hover) { .grip:hover::after { background: var(--accent); } }
.grip.drag { background: linear-gradient(var(--accent), var(--accent)) center / 2px 100% no-repeat; }
body.dragging { user-select: none; -webkit-user-select: none; cursor: col-resize; }
.app.notoc .grip, .app.notoc .side { display: none; }

/* ---------- 右侧目录：整屏高度 ---------- */
.side {
  width: var(--side-w); flex: none; min-width: 0; height: 100%;
  display: flex; flex-direction: column; background: var(--side-bg); position: relative;
}
/* 拖动目录宽度时只平移图层（不触发重排）；目录右侧的空隙用同色补上 */
.app.sdrag .side, .app.sdrag .grip { will-change: transform; }
.app.sdrag .side::after { content: ""; position: absolute; left: 100%; top: 0; bottom: 0; width: 100vw; background: var(--side-bg); }
.search { padding: 6px 6px 4px; }
.search input {
  width: 100%; box-sizing: border-box; min-height: 28px; padding: 0 9px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 12px;
}
.toc {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 3px 3px calc(20px + env(safe-area-inset-bottom, 0px)) 3px;
}
.r { display: flex; align-items: stretch; border-radius: 5px; position: relative; }
.r .chev {
  flex: none; width: 26px; border: 0; background: transparent; padding: 0; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; margin-left: calc(var(--d, 0) * 11px);
}
.r .chev svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
.r .chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.r .chev.none { cursor: default; pointer-events: none; }
.r .chev.none svg { display: none; }
.r .lab {
  flex: 1; min-width: 0; font-size: var(--toc-fs); line-height: 1.35; padding: .36em 6px .36em 0;
  color: var(--toc-sub); cursor: pointer; overflow-wrap: anywhere; user-select: none; -webkit-user-select: none;
}
.r.d0 .lab { color: var(--fg); font-weight: 650; }
.r.d0 { margin-top: 3px; }
/* 当前阅读位置：只跟随正文滚动，点过之后不会留下颜色 */
.r.on { background: var(--accent-soft); }
.r.on .lab { color: var(--accent); font-weight: 650; }
.r.in::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); opacity: .55; }
.r .lab:active { opacity: .6; }
@media (hover: hover) { .r:not(.on):hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); } }
.toc .none { padding: 14px 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }

/* ---------- 弹出面板 ---------- */
.pop {
  position: fixed; left: calc(52px + env(safe-area-inset-left, 0px)); z-index: 15; box-sizing: border-box;
  width: min(380px, 70vw); max-height: 84vh; overflow-y: auto;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px;
  font-size: 13px;
}
.pop h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; }
.btns { display: inline-flex; gap: 5px; align-items: center; }
.btn {
  min-height: 34px; min-width: 38px; padding: 0 12px; border: 1px solid var(--line); background: var(--side-bg);
  border-radius: 8px; font-size: 13px; cursor: pointer;
}
.btn:active { background: var(--accent-soft); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.wide { width: 100%; text-align: left; }
.val { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.dl { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; max-height: 46vh; overflow-y: auto; }
.dl .btn { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
.dl .dgrp { font-size: 11px; color: var(--muted); margin: 8px 2px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find { width: 100%; box-sizing: border-box; min-height: 32px; padding: 0 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--side-bg); color: var(--fg); font: inherit; font-size: 13px; }
#ghConnect { margin-top: 8px; }
.ghform { margin-top: 8px; }
.wr { display: flex; gap: 4px; flex: none; }
.wr .btn:first-child { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wr .btn:last-child { min-width: 38px; padding: 0; }
.row2 { display: flex; gap: 6px; }
.row2 .btn { flex: 1; }
.srcs { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.src { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src button { border: 0; background: transparent; color: var(--muted); font-size: 16px; min-width: 34px; min-height: 30px; }
.hint { margin: 8px 0 0; font-size: 12px; line-height: 1.55; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); font-size: 13px; padding: 9px 14px; border-radius: 8px; max-width: 80vw; z-index: 20;
}
.dropmask {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 82%, transparent); font-size: 18px; font-weight: 600; color: var(--accent);
  border: 3px dashed var(--accent);
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="工具">
    <button class="rb" id="bDocs" type="button" aria-label="文档与同步" title="文档与同步">
      <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg><i class="dot" id="syncDot" hidden></i>
    </button>
    <button class="rb" id="bFold" type="button" aria-label="目录折叠层级" title="目录折叠层级">
      <svg viewBox="0 0 24 24"><path d="M7 9l5-5 5 5"/><path d="M7 15l5 5 5-5"/></svg>
    </button>
    <button class="rb" id="bSearch" type="button" aria-label="筛选目录" aria-pressed="false" title="筛选目录">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <button class="rb" id="bToc" type="button" aria-label="显示或隐藏目录" aria-pressed="true" title="显示或隐藏目录">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M15 5v14"/></svg>
    </button>
    <button class="rb" id="bTr" type="button" aria-label="英文翻译栏" aria-pressed="false" title="英文翻译栏"><span class="aa">EN</span></button>
    <span class="sp"></span>
    <button class="rb" id="bFull" type="button" aria-label="全屏" title="全屏" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="rb" id="bAa" type="button" aria-label="字号与主题" title="字号与主题"><span class="aa">Aa</span></button>
    <button class="rb" id="bTheme" type="button" aria-label="切换深色或浅色" title="切换深色或浅色">
      <svg class="ic-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="ic-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      <svg class="ic-dark" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </nav>

  <div class="col" id="col">
    <main class="main" id="main"><article class="doc" id="doc"></article></main>
    <div class="tgrip" id="tgrip" role="separator" aria-orientation="horizontal" aria-label="拖动调整译文栏高度" tabindex="0" hidden></div>
    <section class="tpane" id="tpane" aria-label="英文翻译" hidden>
      <header class="thead">
        <span class="ttitle">英文翻译</span>
        <button class="btn" id="tAutoBtn" type="button" aria-pressed="true">选中即译</button>
        <button class="btn" id="tNow" type="button" hidden>翻译选中</button>
        <span class="tsp"></span>
        <button class="btn" id="tClear" type="button">清空</button>
        <button class="btn" id="tClose" type="button" aria-label="关闭译文栏">✕</button>
      </header>
      <div class="tlist" id="tlist"></div>
    </section>
  </div>

  <div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="拖动调整目录宽度" tabindex="0"></div>
  <aside class="side" id="side" aria-label="目录">
    <div class="search" id="searchRow" hidden><input id="filter" type="search" placeholder="筛选目录" autocomplete="off" aria-label="筛选目录"></div>
    <nav class="toc" id="toc"></nav>
  </aside>
</div>

<div class="pop" id="pop" hidden>
  <section data-panel="docs">
    <h3>文档</h3>
    <input class="find" id="docFilter" type="search" placeholder="搜索文件" autocomplete="off" aria-label="搜索文件" hidden>
    <div class="dl" id="docList"></div>
    <div class="row2"><button class="btn" id="addFolder" type="button" hidden>添加文件夹…</button><button class="btn" id="openLocal" type="button">打开文件…</button></div>
    <div class="srcs" id="srcList"></div>
    <button class="btn wide" id="ghConnect" type="button" hidden>连接 GitHub 文库…</button>
    <div class="ghform" id="ghForm" hidden>

  var dragging = false, startX = 0, startW = 0, dragW = 0, dragRaf = 0;

    var h = (activeIdx >= 0 && heads[activeIdx]) ? heads[activeIdx].el : null, off = 0;
    if (h) off = h.getBoundingClientRect().top - main.getBoundingClientRect().top;
    S.w = dragW; root.style.setProperty('--side-w', S.w + 'px');

  grip.addEventListener('dblclick', function () { S.w = 260; applySettings(); saveSettings(); });
  grip.addEventListener('keydown', function (e) {

  window.addEventListener('resize', applySettings);

  /* ---------- 弹出面板 ---------- */
  var popFor = null;

    pop.querySelectorAll('[data-panel]').forEach(function (s) { s.hidden = s.dataset.panel !== name; });
    pop.hidden = false; popFor = name;
    var r = btn.getBoundingClientRect();
    pop.style.top = Math.max(6, Math.min(r.top, window.innerHeight - pop.offsetHeight - 8)) + 'px';

  function closePanel() { pop.hidden = true; popFor = null; }
  document.addEventListener('pointerdown', function (e) {

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
  $('bDocs').onclick = function () { openPanel('docs', this); };
  $('bFold').onclick = function () { openPanel('fold', this); };
  $('bAa').onclick = function () { openPanel('aa', this); };

  $('tocMinus').onclick = function () { S.tocFs = clamp(S.tocFs - 1, 9, 20); applySettings(); saveSettings(); };
  $('tocPlus').onclick = function () { S.tocFs = clamp(S.tocFs + 1, 9, 20); applySettings(); saveSettings(); };
  $('bodyMinus').onclick = function () { S.bodyFs = clamp(S.bodyFs - 1, 12, 30); applySettings(); saveSettings(); };
  $('bodyPlus').onclick = function () { S.bodyFs = clamp(S.bodyFs + 1, 12, 30); applySettings(); saveSettings(); };
  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.onclick = function () { S.theme = b.dataset.themeSet; applySettings(); saveSettings(); };
  });
  $('bTheme').onclick = function () { S.theme = effectiveDark() ? 'light' : 'dark'; applySettings(); saveSettings(); };
  $('bToc').onclick = function () { S.hideToc = !S.hideToc; applySettings(); saveSettings(); };
  $('bSearch').onclick = function () {

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  var MATH_RE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`)|(\$\$[\s\S]+?\$\$)|(\\\([\s\S]+?\\\))|(\\\[[\s\S]+?\\\])|(\$[^\s$](?:[^$\n]*?[^\s$])?\$)/g;

  }

  function showDoc(name, html, opts) {

    var anchor = null;
    if (opts.keepPos && activeIdx >= 0 && heads[activeIdx]) anchor = { key: heads[activeIdx].key, off: tops[activeIdx] - main.scrollTop };
    var prevTop = main.scrollTop;

      var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t);

  function buildTree() {

  /* 正文每个标题的位置（滚动时用二分查找，不用每次读布局） */

      if (!show) return;

    });

    markActive(false);
  }

  function toggle(i) {

  }
  function setLevel(n) {
    E = new Set(); autoSet = new Set();
    heads.forEach(function (h) { if (h.kids > 0 && h.d < n - 1) E.add(h.key); });
    saveExpanded(); renderToc(); centerActive(true);
  }

  /* 当前阅读位置所在的分支自动展开，离开后自动收回（你手动展开的不动） */
  function revealActive() {

    while (p >= 0) { anc[heads[p].key] = 1; p = heads[p].parent; }
    autoSet.forEach(function (k) { if (!anc[k]) { E.delete(k); autoSet.delete(k); changed = true; } });
    Object.keys(anc).forEach(function (k) { if (!E.has(k)) { E.add(k); autoSet.add(k); changed = true; } });

  function showWelcome() { showDoc('欢迎使用.md', mdToHtml(WELCOME), { source: 'local', key: 'welcome' }); }
  $('file').addEventListener('change', function (e) { openFiles(e.target.files); });
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; $('dropmask').hidden = false; });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropmask').hidden = true; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; $('dropmask').hidden = true;
    if (e.dataTransfer && e.dataTransfer.files.length) openFiles(e.dataTransfer.files);
  });

  /* ---------- 选中即译：流式调用 Claude，译文固定在底部，不盖住原文 ---------- */
  var tcards = [], T = { ctl: null, last: '', seq: 0 };
  try { tcards = (JSON.parse(lsGet('dr2:tcards') || '[]') || []).filter(function (c) { return c && c.out; }); } catch (e) { tcards = []; }
  var TKEY = lsGet('dr2:akey') || '';
  var T_SYS = [
    'You are an expert Chinese-to-English translator inside a reading app for a software engineer\'s technical interview preparation notes (AI infrastructure, backend systems, machine learning).',
    'Translate the text inside <text> into the most natural, accurate, idiomatic English that a fluent native-speaking engineer would actually say or write.',
    'Rules:',
    '1. Output ONLY the English translation. No preface, no notes, no quotation marks around it, no explanations.',
    '2. Preserve the Markdown structure exactly: **bold**, *italic*, headings (#), bullet and numbered lists with the same nesting and order (one translated item per source item), blockquotes, tables, links, code spans and code blocks (never translate code), and line breaks.',
    '3. Keep technical terms, product and company names, identifiers, numbers, metrics and formulas ($...$) unchanged; use the standard English term for established Chinese technical terms (for example 幂等 -> idempotent, 灰度发布 -> canary release).',
    '4. First-person interview answers should read as fluent, confident spoken professional English (active voice, natural phrasing). Headings, labels and notes should read as concise written English.',
    '5. Parts that are already in English stay as they are.',
    '6. The <context> block only tells you where the text sits in the document, to resolve ambiguity. Never translate or output it.'
  ].join('\n');
  var MODEL_NAME = { 'claude-haiku-5-5': 'Haiku 5.5', 'claude-sonnet-5-5': 'Sonnet 5.5' };
  var tdSvc = null;

  function turndown() {
    if (tdSvc || typeof TurndownService === 'undefined') return tdSvc;
    tdSvc = new TurndownService({ headingStyle: 'atx', bulletListMarker: '-', codeBlockStyle: 'fenced', emDelimiter: '*', strongDelimiter: '**' });
    tdSvc.addRule('mjx', {
      filter: function (n) { return n.nodeName && n.nodeName.toLowerCase() === 'mjx-container'; },
      replacement: function (c, n) { return n.getAttribute('data-tex') || ''; }
    });
    tdSvc.addRule('tbl', {
      filter: 'table',
      replacement: function (c, n) {
        var rows = [].slice.call(n.querySelectorAll('tr')).map(function (tr) {
          return [].slice.call(tr.children).map(function (cell) { return cell.textContent.replace(/\s+/g, ' ').replace(/\|/g, '\\|').trim(); });
        });
        if (!rows.length) return '';
        var out = ['| ' + rows[0].join(' | ') + ' |', '| ' + rows[0].map(function () { return '---'; }).join(' | ') + ' |'];
        rows.slice(1).forEach(function (r) { out.push('| ' + r.join(' | ') + ' |'); });
        return '\n\n' + out.join('\n') + '\n\n';
      }
    });
    return tdSvc;
  }
  /* 公式渲染后，把原始 TeX 记在元素上，这样选中含公式的文字时能还原成 $...$ */
  function tagTex() {
    try {
      var list = window.MathJax && MathJax.startup && MathJax.startup.document && MathJax.startup.document.math;
      if (!list) return;
      for (var m of list) {
        if (m.typesetRoot && m.typesetRoot.setAttribute) {
          var d = m.display ? '$$' : '$';
          m.typesetRoot.setAttribute('data-tex', d + m.math + d);
        }
      }
    } catch (e) {}
  }
  /* 把选中的正文还原成 Markdown（保留加粗、斜体、分点、标题、表格、公式） */
  function normText(s) { return s.replace(/\s+/g, ' ').trim(); }
  function ownText(el) {                       // 一个块自己的文字（不含嵌套的子列表）
    var c = el.cloneNode(true);
    [].slice.call(c.querySelectorAll('ul,ol')).forEach(function (n) { n.remove(); });
    return normText(c.textContent);
  }
  function blockOf(node) {
    var el = node.nodeType === 1 ? node : node.parentElement;
    return el && el.closest ? el.closest('li,p,h1,h2,h3,h4,h5,h6,blockquote') : null;
  }
  /* 选中了整条列表项 / 整个段落 / 整个标题时，把这个块本身（圆点、编号、#）也带上，译文才会是同样的格式 */
  function wholeBlockFor(range, plain) {
    var sb = blockOf(range.startContainer), eb = blockOf(range.endContainer);
    if (!sb || sb !== eb || !doc.contains(sb)) return null;
    var own = ownText(sb);
    if (!own || normText(plain).length < own.length * 0.9) return null;   // 只选了一部分：就按选中的那部分翻译
    var copy = sb.cloneNode(true);
    if (sb.tagName === 'LI') {
      [].slice.call(copy.querySelectorAll('ul,ol')).forEach(function (n) { n.remove(); });
      var list = sb.parentElement, ordered = list && list.tagName === 'OL', wrap = document.createElement(ordered ? 'ol' : 'ul');
      if (ordered) wrap.setAttribute('start', String((parseInt(list.getAttribute('start') || '1', 10) || 1) + [].indexOf.call(list.children, sb)));
      wrap.appendChild(copy); return wrap;
    }
    return copy;
  }
  function tidyMd(s) {   // 去掉行尾空格和只有空格的行，把“-   ”“1.  ”规整成“- ”“1. ”
    return s.replace(/[ \t]+$/gm, '').replace(/^(\s*)([-*+]|\d+\.)[ \t]{2,}/gm, '$1$2 ').replace(/\n{3,}/g, '\n\n').trim();
  }
  function selectionToMarkdown(range, plain) {
    var svc = turndown();
    if (!svc) return range.toString().trim();
    var whole = wholeBlockFor(range, plain || range.toString());
    if (whole) { var wb = document.createElement('div'); wb.appendChild(whole); return tidyMd(svc.turndown(wb)); }
    var frag = range.cloneContents(), node = range.commonAncestorContainer;
    var el = node.nodeType === 1 ? node : node.parentElement, cur = frag;
    while (el && el !== doc) {
      var tg = el.tagName;
      var wrapIt = /^(STRONG|B|EM|I|CODE|H[1-6])$/.test(tg) || (/^(UL|OL)$/.test(tg) && cur.firstElementChild && cur.firstElementChild.tagName === 'LI');
      if (wrapIt) { var w = document.createElement(tg); w.appendChild(cur); cur = w; }
      el = el.parentElement;
    }
    var box = document.createElement('div'); box.appendChild(cur);
    return tidyMd(svc.turndown(box));
  }
  function contextFor(range) {
    var r = range.getBoundingClientRect(), y = r.top - main.getBoundingClientRect().top + main.scrollTop + 2;
    var lo = 0, hi = heads.length - 1, idx = -1;
    while (lo <= hi) { var m = (lo + hi) >> 1; if (tops[m] <= y) { idx = m; lo = m + 1; } else hi = m - 1; }
    var chain = [], p = idx;
    while (p >= 0 && chain.length < 3) { chain.unshift(heads[p].text); p = heads[p].parent; }
    return chain.join(' > ');
  }

  function terr(e) {
    var s = e && e.status, m = e && e.msg ? '（' + e.msg + '）' : '';
    if (s === 401) return '密钥无效或已被删除' + m;
    if (s === 403) return '这个密钥没有权限' + m;
    if (s === 429) return '请求太频繁，或额度用完了，稍后再试' + m;
    if (s === 400) return '请求被拒绝' + m;
    if (s) return 'Anthropic 返回 ' + s + m;
    return '连不上 Anthropic（网络问题）';
  }
  /* 流式调用 Claude Messages API；onDelta 每收到一段译文就回调一次，返回 stop_reason */
  function streamClaude(md, ctx, signal, onDelta) {
    var body = {
      model: S.tModel,
      max_tokens: Math.min(4096, Math.max(800, md.length * 2)),
      stream: true,
      system: T_SYS,
      output_config: { effort: 'low' },
      messages: [{ role: 'user', content: (ctx ? '<context>' + ctx + '</context>\n' : '') + '<text>\n' + md + '\n</text>' }]
    };
    if (S.tModel === 'claude-haiku-5-5') body.thinking = { type: 'disabled' };   // 翻译不需要推理，关掉最快
    return fetch((window.__ANTHROPIC_BASE || 'https://api.anthropic.com') + '/v1/messages', {
      method: 'POST', signal: signal,
      headers: {
        'content-type': 'application/json', 'x-api-key': TKEY, 'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var msg = ''; try { msg = (JSON.parse(t).error || {}).message || ''; } catch (e) {}
          throw { status: res.status, msg: msg };
        });
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', stop = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return stop;
          buf += dec.decode(r.value, { stream: true }).replace(/\r\n/g, '\n');
          var i;
          while ((i = buf.indexOf('\n\n')) >= 0) {
            var ev = buf.slice(0, i); buf = buf.slice(i + 2);
            var line = ev.split('\n').filter(function (l) { return l.indexOf('data:') === 0; })[0];
            if (!line) continue;
            var d; try { d = JSON.parse(line.slice(5)); } catch (e) { continue; }
            if (d.type === 'content_block_delta' && d.delta && d.delta.type === 'text_delta') onDelta(d.delta.text);
            else if (d.type === 'message_delta' && d.delta && d.delta.stop_reason) stop = d.delta.stop_reason;
            else if (d.type === 'error') throw { status: 0, msg: (d.error && d.error.message) || '' };
          }
          return pump();
        });
      }
      return pump();
    });
  }

  function persistCards() {
    var keep = tcards.filter(function (c) { return c.status === 'done'; }).slice(0, 40)
      .map(function (c) { return { id: c.id, src: c.src, out: c.out, status: 'done', ts: c.ts, model: c.model, ms: c.ms, ttft: c.ttft }; });
    lsSet('dr2:tcards', JSON.stringify(keep));
  }
  function cardMeta(c) {
    if (c.status === 'run') return c.ttft ? '翻译中…' : '等待响应…';
    if (c.partial) return '已中断（选了新的内容）';
    var m = MODEL_NAME[c.model] || '';
    return c.ms ? (c.ttft ? (c.ttft / 1000).toFixed(1) + ' 秒出字 · ' : '') + (c.ms / 1000).toFixed(1) + ' 秒 · ' + m : m;
  }
  function paintCard(c, force) {
    if (!c.el || (!force && !c.el.isConnected)) return;
    var body = c.el.querySelector('.tbody');
    body.classList.toggle('typing', c.status === 'run');
    body.innerHTML = c.status === 'err'
      ? '<p class="terr">' + esc(c.err || '翻译失败') + '</p>' + (c.out ? DOMPurify.sanitize(mdToHtml(c.out)) : '')
      : DOMPurify.sanitize(mdToHtml(c.out || ''));
    c.el.querySelector('.tmeta').textContent = cardMeta(c);
  }
  function typesetCard(c) {
    if (c.el && c.el.isConnected && window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([c.el]).catch(function () {}); }
  }
  function buildCard(c) {
    var el = document.createElement('div'); el.className = 'tcard'; el.dataset.id = c.id;
    var plain = c.src.replace(/[#*>\-`$|]/g, ' ').replace(/\s+/g, ' ').trim();
    el.innerHTML = '<div class="thd"><span class="tsrc">原文：' + esc(plain.slice(0, 60)) + '</span><span class="tmeta"></span>' +
      '<button class="tx" type="button" data-act="copy">复制</button><button class="tx" type="button" data-act="del" aria-label="关闭这条译文">✕</button></div><div class="tbody"></div>';
    c.el = el; paintCard(c, true);
    return el;
  }
  function renderTCards() {
    var box = $('tlist'); box.innerHTML = '';
    if (!TKEY) {
      box.innerHTML = '<div class="thint">填写 Anthropic API 密钥后，在正文里选中文字就会自动翻译成英文。<br><button class="btn" id="tGoKey" type="button">填写密钥</button></div>';
      $('tGoKey').onclick = function () { openPanel('aa', $('bAa')); };
      return;
    }
    if (!tcards.length) { box.innerHTML = '<div class="thint">在正文里选中一段文字，译文会出现在这里，一直留着，直到你点 ✕ 关掉。</div>'; return; }
    tcards.forEach(function (c) { box.appendChild(buildCard(c)); typesetCard(c); });
  }
  $('tlist').addEventListener('click', function (e) {
    var b = e.target.closest('.tx'); if (!b) return;
    var el = b.closest('.tcard'), c = tcards.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!c) return;
    if (b.dataset.act === 'del') {
      if (c.status === 'run' && T.ctl) T.ctl.abort();
      tcards = tcards.filter(function (x) { return x !== c; }); persistCards(); el.remove();
      if (!tcards.length) renderTCards();
    } else {
      var txt = c.out || '';
      try { navigator.clipboard.writeText(txt).then(function () { toast('已复制译文'); }, function () { toast('复制失败'); }); } catch (err) { toast('复制失败'); }
    }
  });

  function startTranslate(md, ctx) {
    if (!TKEY) { renderTCards(); toast('先填写 Anthropic API 密钥'); return; }
    if (tcards[0] && tcards[0].src === md && tcards[0].status !== 'err') return;   // 刚翻过同一段，不重复
    if (T.ctl) T.ctl.abort();
    var ctl = new AbortController(); T.ctl = ctl;
    var c = { id: (++T.seq) + '-' + Date.now(), src: md, out: '', status: 'run', ts: Date.now(), model: S.tModel };
    tcards.unshift(c);
    var box = $('tlist'), hint = box.querySelector('.thint'); if (hint) hint.remove();
    box.insertBefore(buildCard(c), box.firstChild); box.scrollTop = 0;     // 只插入新卡片，不重建旧的
    var t0 = performance.now(), raf = 0;
    var paint = function () { raf = 0; paintCard(c); };
    streamClaude(md, ctx, ctl.signal, function (d) {
      if (!c.ttft) c.ttft = performance.now() - t0;
      c.out += d; if (!raf) raf = requestAnimationFrame(paint);
    }).then(function (stop) {
      c.status = 'done';
      if (stop === 'max_tokens') c.out += '\n\n…（内容太长，输出被截断，请缩短选区）';
      if (stop === 'refusal') { c.status = 'err'; c.err = '模型拒绝翻译这段内容'; }
    }).catch(function (e) {
      if (e && e.name === 'AbortError') { c.status = c.out ? 'done' : 'gone'; c.partial = !!c.out; }
      else { c.status = 'err'; c.err = terr(e); T.last = ''; }
    }).then(function () {
      c.ms = performance.now() - t0;
      if (T.ctl === ctl) T.ctl = null;
      if (raf) cancelAnimationFrame(raf);
      if (c.status === 'gone') { tcards = tcards.filter(function (x) { return x !== c; }); if (c.el) c.el.remove(); if (!tcards.length) renderTCards(); return; }
      paintCard(c); typesetCard(c); persistCards();
    });
  }

  var selTimer = 0;
  function handleSelection(force) {
    if (!S.tOpen || (!S.tAuto && !force)) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { T.last = ''; return; }
    var range = sel.getRangeAt(0), node = range.commonAncestorContainer, el = node.nodeType === 1 ? node : node.parentElement;
    if (!el || !doc.contains(el)) return;                      // 只翻译正文里选中的内容
    var plain = sel.toString().trim();
    if (plain.length < 2) return;
    if (plain.length > 8000) { toast('选区太长（超过 8000 字），请分几次选'); return; }
    if (!force && plain === T.last) return;
    T.last = plain;
    var md = selectionToMarkdown(range, plain);
    if (!md) return;
    startTranslate(md, contextFor(range));
  }
  document.addEventListener('selectionchange', function () {
    clearTimeout(selTimer);
    selTimer = setTimeout(function () { handleSelection(false); }, 450);   // 选区稳定半秒后再翻译，拖动选择手柄时不会乱发请求
  });
  $('tNow').addEventListener('pointerdown', function (e) { e.preventDefault(); });
  $('tNow').onclick = function () { T.last = ''; handleSelection(true); };

  $('bTr').onclick = function () { S.tOpen = !S.tOpen; applySettings(); saveSettings(); if (S.tOpen) renderTCards(); };
  $('tClose').onclick = function () { S.tOpen = false; if (T.ctl) T.ctl.abort(); applySettings(); saveSettings(); };
  $('tClear').onclick = function () { if (T.ctl) T.ctl.abort(); tcards = []; persistCards(); renderTCards(); };
  $('tAutoBtn').onclick = function () { S.tAuto = !S.tAuto; applySettings(); saveSettings(); toast(S.tAuto ? '已开启：选中即译' : '已关闭自动翻译，选中后点“翻译选中”'); };
  document.querySelectorAll('[data-tmodel]').forEach(function (b) {
    b.onclick = function () { S.tModel = b.dataset.tmodel; applySettings(); saveSettings(); };
  });
  function keyHint() {
    $('tKeyHint').textContent = TKEY
      ? '密钥已保存在这台设备的浏览器里（…' + TKEY.slice(-4) + '）。翻译请求从这台设备直接发给 Anthropic，不经过别的服务器。建议用单独建的密钥，并设置月度额度上限。'
      : '到 console.anthropic.com 创建一个 API 密钥（和 Claude 会员是两套账号），粘贴到上面。';
  }
  $('tKeySave').onclick = function () {
    var k = $('tKey').value.trim();
    if (!/^sk-ant-/.test(k)) { toast('密钥应以 sk-ant- 开头'); return; }
    TKEY = k; lsSet('dr2:akey', k); $('tKey').value = ''; keyHint(); renderTCards(); toast('密钥已保存');
  };
  $('tKeyClear').onclick = function () { TKEY = ''; lsSet('dr2:akey', ''); keyHint(); renderTCards(); toast('密钥已删除'); };
  keyHint();

  /* 译文栏高度：拖动上边的横条 */
  /* 为什么不卡：改变正文区域的高度会让整篇文档重新排版。所以拖动时把译文栏按“最大高度”排好版、
     让它浮在正文下沿，拖动只是上下平移（由显卡合成，不排版不重绘）。译文栏内容是从上往下排的，
     露出多少就是多少，和松手后的样子完全一致；松手后再一次性落定。 */
  var tg = $('tgrip'), tp = $('tpane'), colEl = $('col'), tDrag = false, tMoved = false, tStartY = 0, tStartH = 0, tRaf = 0, tMax = 0;
  function setTpY(h) { var t = 'translate3d(0,' + (tMax - h) + 'px,0)'; tp.style.transform = t; tg.style.transform = t; }
  tg.addEventListener('pointerdown', function (e) {
    tDrag = true; tMoved = false; tStartY = e.clientY; tStartH = tp.offsetHeight;
    tMax = Math.max(Math.round(window.innerHeight * 0.7), tStartH);
    var mh = main.offsetHeight; main.style.flex = 'none'; main.style.height = mh + 'px';
    colEl.style.setProperty('--tp-max', tMax + 'px'); setTpY(tStartH); colEl.classList.add('tdrag');
    document.addEventListener('selectstart', noSel);
    tg.setPointerCapture(e.pointerId); tg.classList.add('drag'); e.preventDefault();
  });
  tg.addEventListener('pointermove', function (e) {
    if (!tDrag) return;
    S.th = clamp(tStartH - (e.clientY - tStartY), 100, window.innerHeight * 0.7); tMoved = true;
    /* 每帧只更新一次（iPad 手指每秒会报几十到上百次位置） */
    if (!tRaf) tRaf = requestAnimationFrame(function () { tRaf = 0; setTpY(S.th); });
  });
  function endTDrag() {
    if (!tDrag) return; tDrag = false; tg.classList.remove('drag'); document.removeEventListener('selectstart', noSel);
    if (tRaf) { cancelAnimationFrame(tRaf); tRaf = 0; }
    if (tMoved) root.style.setProperty('--tp-h', S.th + 'px');
    colEl.classList.remove('tdrag'); colEl.style.removeProperty('--tp-max');
    tp.style.transform = ''; tg.style.transform = ''; main.style.flex = ''; main.style.height = '';
    if (tMoved) saveSettings(); else applySettings();
  }
  tg.addEventListener('pointerup', endTDrag); tg.addEventListener('pointercancel', endTDrag);
  tg.addEventListener('dblclick', function () { S.th = 0; applySettings(); saveSettings(); });
  if (S.tOpen) renderTCards();

  /* ---------- 启动 ---------- */
  applySettings();
  renderToc();
  if (NATIVE) { nsend({ type: 'ready' }); return; }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }
  restoreKV().then(function () { return fetch('api/docs', { cache: 'no-store' }); }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (list) {
    serverOn = true; lastSync = new Date(); serverDocs = list;
    if (!list.length) throw 0;
    var want = lsGet('dr2:cur');
    var d = list.find(function (x) { return x.name === want; }) || list[0];
    return loadServerDoc(d, false).then(renderDocList);
  }).catch(function () {
    serverOn = false; noServer = true;
    $('openLocal').textContent = '上传 Markdown / Word…';
    $('ghConnect').hidden = false;
    loadWebDocs().then(function () {
      var showLocal = function () {
        var want = lsGet('dr2:webcur');
        var d = webDocs.filter(function (x) { return x.name === want; })[0] || webDocs[0];
        if (d) openWebDoc(d, false); else showWelcome();
        renderDocList();
      };
      if (GH) ghOpenSaved().then(function (ok) { if (!ok) showLocal(); renderDocList(); });
      else showLocal();
    });
  });
})();
</script>
